[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "robotpy-sphinx-plugin"
description = "Common Sphinx tooling for RobotPy projects"
readme = "README.md"
requires-python = ">=3.6"
license = "BSD-3-Clause"
authors = [
  { name = "Dustin Spicuzza", email = "robotpy@googlegroups.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]
dependencies = [
  "sphinx-autodoc-typehints",
  "sphinx-automodapi",
  "requests",
  "packaging",
  "toml",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/robotpy/robotpy-sphinx-plugin"
Repository = "https://github.com/robotpy/robotpy-sphinx-plugin"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
  "/robotpy_sphinx",
  "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["robotpy_sphinx"]

[tool.black]
target-version = ["py36"]
exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.nox
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''
